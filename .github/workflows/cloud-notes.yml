name: iCourse Cloud Notes
on:
  schedule:
    - cron: "36 11 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: icourse-cloud-notes
  cancel-in-progress: false
jobs:
  notes:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-cloud.txt
      - name: Install dependencies
        run: |
          pip install -r requirements-cloud.txt --timeout 120 --retries 5
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
      - uses: actions/cache@v4
        id: models
        with:
          path: |
            sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17
            silero_vad.onnx
          key: icourse-cloud-sensevoice-v1
      - name: Download speech models
        if: steps.models.outputs.cache-hit != 'true'
        run: |
          curl --fail --location --retry 5 -o model.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17.tar.bz2
          tar xf model.tar.bz2
          curl --fail --location --retry 5 -o silero_vad.onnx https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.onnx
      - name: Process courses and save encrypted checkpoints
        timeout-minutes: 315
        env:
          PYTHONUTF8: '1'
          StuId: ${{ secrets.CLOUD_STUID }}
          UISPsw: ${{ secrets.CLOUD_UISPSW }}
          COURSE_IDS: ${{ secrets.CLOUD_COURSE_IDS }}
          DEEPSEEK_API_KEY: ${{ secrets.CLOUD_DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.ICOURSE_DEEPSEEK_MODEL }}
          SMTP_EMAIL: ${{ secrets.CLOUD_SMTP_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.CLOUD_SMTP_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.CLOUD_RECEIVER_EMAIL }}
          WORKSPACE_KEY: ${{ secrets.CLOUD_WORKSPACE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -u -m cloud_notes.runner
